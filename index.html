<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEATH STORE - RESGATE</title>
    <style>
        :root {
            --red: #ff0000;
            --black: #000000;
            --dark: #0a0a0a;
        }

        body {
            background: radial-gradient(circle at top, #1a0000, var(--black));
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--red);
            text-shadow: 0 0 20px var(--red);
            margin: 25px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .container {
            background: var(--dark);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid var(--red);
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.4);
        }

        input {
            width: 85%;
            padding: 15px;
            background: #000;
            border: 1px solid var(--red);
            color: var(--red);
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1rem;
            outline: none;
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #700, #f00);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        #game-area { display: none; }
        
        .roleta-wrap {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px auto;
        }

        .ponteiro {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid gold;
            z-index: 50;
        }

        .roleta {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid var(--red);
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
        }

        /* TELA DE RESGATE */
        #resgate-card {
            display: none;
            background: #111;
            border: 2px dashed var(--red);
            padding: 20px;
            margin-top: 20px;
            border-radius: 15px;
        }

        .valor-ganho {
            font-size: 2rem;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            margin: 10px 0;
        }

        .aviso-print {
            color: #ff0;
            font-size: 0.8rem;
            animation: piscar 1s infinite;
            margin-bottom: 15px;
        }

        @keyframes piscar {
            50% { opacity: 0.3; }
        }

        .qr-code {
            background: white;
            padding: 10px;
            display: inline-block;
            border-radius: 10px;
            margin: 10px 0;
        }

        .footer-info {
            font-size: 0.7rem;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>DEATH STORE</h1>

    <div class="container">
        <div id="login-area">
            <p style="font-size: 0.8rem; color: #bbb;">AUTENTICAÇÃO DE KEY</p>
            <input type="text" id="keyInput" placeholder="COLE SUA KEY">
            <button onclick="ativarKey()">VALIDAR ACESSO</button>
        </div>

        <div id="game-area">
            <div id="roleta-container">
                <div class="roleta-wrap">
                    <div class="ponteiro"></div>
                    <div class="roleta" id="roleta">
                        <canvas id="canvas" width="300" height="300"></canvas>
                    </div>
                </div>
                <button id="spinBtn" onclick="girarRoleta()">GIRAR ROLETA (5s)</button>
            </div>

            <div id="resgate-card">
                <div class="aviso-print">⚠️ TIRE UM PRINT E ENVIE PARA O MSK OU CANTE</div>
                <p style="margin:0; font-size: 0.9rem;">PARABÉNS, VOCÊ GANHOU:</p>
                <div class="valor-ganho" id="valFinal">0 GEMAS</div>
                
                <div class="qr-code" id="qrContainer">
                    </div>
                
                <div style="font-size: 0.7rem; color: var(--red); margin: 5px 0;" id="keyResgate">KEY: ---</div>
                <p class="footer-info">Envie este comprovante para validar seu prêmio.</p>
            </div>
        </div>
    </div>

<script>
    const BANCO_DE_KEYS = {
        "DS-KEY-01": "1.500.000", "DS-KEY-02": "1.500.000", "DS-KEY-03": "1.500.000",
        "DS-KEY-04": "1.500.000", "DS-KEY-05": "1.000.000", "DS-KEY-06": "1.000.000",
        "DS-KEY-07": "1.000.000", "DS-KEY-08": "1.500.000", "DS-KEY-09": "1.000.000",
        "DS-KEY-10": "1.500.000", "DS-KEY-11": "1.000.000", "DS-KEY-12": "1.000.000"
    };

    const premiosVisuais = ["1.000.000", "7.000.000", "1.500.000", "12.000.000", "1.000.000", "4.000.000", "1.500.000", "18.000.000", "1.000.000", "5.000.000", "1.500.000", "25.000.000", "1.000.000", "15.000.000", "1.500.000", "5 KEYS"];
    
    let premioDestaKey = "";
    let keyUsada = "";
    const roleta = document.getElementById("roleta");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function ativarKey() {
        const input = document.getElementById("keyInput").value.trim().toUpperCase();
        const usadas = JSON.parse(localStorage.getItem('ds_usadas') || "[]");

        if (usadas.includes(input)) return alert("ESSA KEY JÁ FOI UTILIZADA!");

        if (BANCO_DE_KEYS[input]) {
            premioDestaKey = BANCO_DE_KEYS[input];
            keyUsada = input;
            usadas.push(input);
            localStorage.setItem('ds_usadas', JSON.stringify(usadas));
            document.getElementById("login-area").style.display = "none";
            document.getElementById("game-area").style.display = "block";
            desenharRoleta();
        } else {
            alert("KEY INVÁLIDA!");
        }
    }

    function desenharRoleta() {
        const n = premiosVisuais.length;
        const ang = (Math.PI * 2) / n;
        for (let i = 0; i < n; i++) {
            ctx.beginPath();
            ctx.moveTo(150, 150);
            ctx.arc(150, 150, 150, i * ang, (i + 1) * ang);
            ctx.fillStyle = i % 2 ? "#000" : "#300";
            ctx.fill();
            ctx.strokeStyle = "#f00";
            ctx.stroke();
            ctx.save();
            ctx.translate(150, 150);
            ctx.rotate(i * ang + ang / 2);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 9px Arial";
            ctx.fillText(premiosVisuais[i], 80, 5);
            ctx.restore();
        }
    }

    function girarRoleta() {
        document.getElementById("spinBtn").disabled = true;
        let indices = [];
        premiosVisuais.forEach((v, i) => { if(v === premioDestaKey) indices.push(i); });
        const index = indices[Math.floor(Math.random() * indices.length)];
        const fatia = 360 / premiosVisuais.length;
        const rotaçãoFinal = 3600 + (360 - (index * fatia + fatia / 2));
        roleta.style.transform = `rotate(${rotaçãoFinal}deg)`;

        setTimeout(() => {
            // Esconde roleta e mostra resgate
            document.getElementById("roleta-container").style.display = "none";
            document.getElementById("resgate-card").style.display = "block";
            document.getElementById("valFinal").innerText = premioDestaKey + " GEMAS";
            document.getElementById("keyResgate").innerText = "AUTH KEY: " + keyUsada;
            
            // Gera QR Code falso mas visualmente autêntico
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=DEATHSTORE-${keyUsada}-${premioDestaKey}`;
            document.getElementById("qrContainer").innerHTML = `<img src="${qrUrl}" alt="QR">`;
        }, 5000);
    }
</script>
</body>
</html>
